[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "non-orientable-uv"
version = "1.0.0"
description = "Seamless UV unwrapping via non-orientable topology"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MacMayo1993"}
]
keywords = ["uv-mapping", "mesh-parameterization", "topology", "blender", "computer-graphics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.5.0",
    "mypy>=1.5.0",
    "matplotlib>=3.7.0",
]
mesh = [
    "trimesh>=3.23.0",
]

[project.urls]
Homepage = "https://github.com/MacMayo1993/SEAM-UV-Mapping"
Documentation = "https://github.com/MacMayo1993/SEAM-UV-Mapping/tree/main/docs"
Repository = "https://github.com/MacMayo1993/SEAM-UV-Mapping"
Issues = "https://github.com/MacMayo1993/SEAM-UV-Mapping/issues"

[project.scripts]
non-orientable-benchmark = "benchmarks.run_benchmarks:main"

[tool.setuptools]
packages = ["addon", "addon.core", "addon.ui"]

[tool.setuptools.package-data]
addon = ["shaders/*.glsl"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "N806",  # Allow uppercase variable names (scientific variables like K, H)
    "E402",  # Module level import not at top (needed for Blender)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]  # Allow unused imports and unsorted imports in __init__.py
"tests/*.py" = ["F841"]  # Allow unused variables in tests

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "matplotlib.*",
    "trimesh.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["addon"]
omit = [
    "*/tests/*",
    "*/benchmarks/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
